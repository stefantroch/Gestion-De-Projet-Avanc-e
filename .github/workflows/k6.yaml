name: k6 smoke test

on:
  push:
  pull_request:

jobs:
  k6:
    runs-on: ubuntu-latest
    services:
      quickpizza:
        image: ghcr.io/grafana/quickpizza-local:latest
        ports:
          - 3333:3333
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - run: k6 run solutions/ex2-load.js