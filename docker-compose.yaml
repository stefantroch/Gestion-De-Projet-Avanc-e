services:
  # L'application qu'on va tester : http://localhost:3333
  quickpizza:
    image: ghcr.io/grafana/quickpizza-local:latest
    ports:
      - "3333:3333"

  # Le dashboard de démo (Node.js + k6) : http://localhost:4000
  dashboard:
    build: ./dashboard
    init: true
    depends_on:
      - quickpizza
    ports:
      - "4000:4000"
    environment:
      - BASE_URL=http://quickpizza:3333
    volumes:
      - ./demo:/app/demo:ro # modifie ou ajoute un script dans demo/ : un nouveau bouton apparaît
