services:
  quickpizza:
    image: ghcr.io/grafana/quickpizza-local:latest
    ports:
      - "3333:3333"

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources

  k6:
    image: grafana/k6:latest
    depends_on:
      - quickpizza
      - prometheus
    ports:
      - "5665:5665"
    environment:
      - BASE_URL=http://quickpizza:3333
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
      - K6_PROMETHEUS_RW_TREND_STATS=avg,p(95),p(99),max
      - K6_WEB_DASHBOARD=true
      - K6_WEB_DASHBOARD_HOST=0.0.0.0
    volumes:
      - .:/work
    working_dir: /work
    command: run -o experimental-prometheus-rw ${SCRIPT:-demo/load_test.js}

volumes:
  prometheus-data:
  grafana-data: