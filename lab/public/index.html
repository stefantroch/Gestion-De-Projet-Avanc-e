<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labo k6</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg:#fff; --fg:#1b1f24; --card:#f4f5f7; --bd:#d0d4da; --ac:#7d64ff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171c; --fg:#e6e8eb; --card:#1d2128; --bd:#323843; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:10px 16px; border-bottom:1px solid var(--bd); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:16px; margin:0 8px 0 0; }
  main { display:grid; grid-template-columns:minmax(300px,1fr) minmax(300px,1.3fr); gap:12px; padding:12px; }
  @media (max-width:800px) { main { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:8px; padding:10px; }
  select, button { font:inherit; padding:6px 12px; border-radius:6px; border:1px solid var(--bd); background:var(--bg); color:var(--fg); }
  button { cursor:pointer; } button.run { background:var(--ac); color:#fff; border-color:var(--ac); }
  button.stop { background:#d64545; color:#fff; border-color:#d64545; } button:disabled { opacity:.4; cursor:default; }
  textarea { width:100%; height:420px; font:13px ui-monospace, Consolas, monospace; background:var(--bg); color:var(--fg);
    border:1px solid var(--bd); border-radius:6px; padding:8px; resize:vertical; tab-size:2; }
  pre { height:170px; overflow:auto; margin:8px 0 0; font:12px ui-monospace, Consolas, monospace; white-space:pre-wrap; }
  #status { margin-left:auto; } .canvas { position:relative; height:340px; }
</style>
</head>
<body>
<header>
  <h1>Labo k6</h1>
  <select id="file"></select>
  <button id="reload">Recharger le fichier</button>
  <button id="run" class="run">▶ Lancer</button>
  <button id="stop" class="stop" disabled>■ Arrêter</button>
  <span id="status">Prêt</span>
</header>
<main>
  <section class="card">
    <textarea id="code" spellcheck="false"></textarea>
    <small>Modifie le script puis relance : le fichier sur le disque n'est pas modifié.</small>
  </section>
  <section>
    <div class="card"><div class="canvas"><canvas id="chart"></canvas></div></div>
    <div class="card" style="margin-top:12px"><pre id="log"></pre></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const chart = new Chart($('chart'), {
  type: 'line',
  data: { labels: [], datasets: [
    { label: 'p95 (ms)', data: [], borderColor: '#d64545', tension: .25, yAxisID: 'y' },
    { label: 'moyenne (ms)', data: [], borderColor: '#4a90e2', tension: .25, yAxisID: 'y' },
    { label: 'req/s', data: [], borderColor: '#2da44e', tension: .25, yAxisID: 'y1' },
  ] },
  options: {
    maintainAspectRatio: false, animation: false, interaction: { mode: 'index', intersect: false },
    scales: {
      x: { title: { display: true, text: 'secondes' } },
      y: { beginAtZero: true, position: 'left', title: { display: true, text: 'latence (ms)' } },
      y1: { beginAtZero: true, position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'req/s' } },
    },
  },
});

function resetChart() { chart.data.labels = []; chart.data.datasets.forEach(d => d.data = []); chart.update(); $('log').textContent = ''; }
function setRunning(r) { $('run').disabled = r; $('stop').disabled = !r; }

async function loadFile() {
  const r = await fetch('/api/script?f=' + encodeURIComponent($('file').value));
  $('code').value = r.ok ? await r.text() : '// fichier introuvable';
}
async function init() {
  const info = await (await fetch('/api/info')).json();
  $('status').textContent = `Prêt · mode ${info.mode} · cible ${info.base}`;
  const list = await (await fetch('/api/scripts')).json();
  $('file').innerHTML = list.map(f => `<option>${f}</option>`).join('');
  if (list.length) loadFile(); else $('code').value = "// Aucun script trouvé dans demo/, solutions/ ou exercises/";
}
$('file').onchange = loadFile;
$('reload').onclick = loadFile;
$('run').onclick = async () => {
  resetChart();
  const r = await fetch('/api/run', { method: 'POST', body: JSON.stringify({ code: $('code').value }) });
  if (r.ok) { setRunning(true); $('status').textContent = 'Test en cours…'; }
  else $('status').textContent = 'Un test est déjà en cours';
};
$('stop').onclick = () => fetch('/api/stop', { method: 'POST' });

const es = new EventSource('/api/events');
es.addEventListener('tick', e => {
  const d = JSON.parse(e.data);
  chart.data.labels.push(d.t);
  chart.data.datasets[0].data.push(+d.p95.toFixed(2));
  chart.data.datasets[1].data.push(+d.avg.toFixed(2));
  chart.data.datasets[2].data.push(d.reqs);
  chart.update();
  $('status').textContent = `t=${d.t}s · ${d.vus} VUs · ${d.reqs} req/s · ${d.err} erreurs`;
});
es.addEventListener('log', e => { const l = $('log'); l.textContent += JSON.parse(e.data); l.scrollTop = l.scrollHeight; });
es.addEventListener('done', e => {
  setRunning(false);
  const c = JSON.parse(e.data).code;
  $('status').textContent = c === 0 ? 'Terminé : succès (code 0)'
    : c === 99 ? 'Terminé : thresholds non respectés (code 99)' : `Terminé : code ${c}`;
});
init();
</script>
</body>
</html>
